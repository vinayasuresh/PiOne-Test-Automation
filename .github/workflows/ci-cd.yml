name: PiOne Testmate CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git branch, tag, or commit SHA to test and deploy
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: pione-testmate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-and-tests:
    name: Python quality and V2 unit suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile application source
        run: python -m compileall -q api automation_framework

      - name: Run default V2 test suite
        run: |
          mkdir -p artifacts
          pytest -q --junitxml=artifacts/unit-results.xml

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-evidence-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  release-source:
    name: Build deployable source bundle
    needs: quality-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Check out tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Build versioned source archive
        id: release
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release
          RELEASE_SHA="$(git rev-parse HEAD)"

          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

          git archive \
            --format=tar.gz \
            --prefix=pione-testmate/ \
            HEAD > "release/pione-testmate-${RELEASE_SHA}.tar.gz"

          echo "$RELEASE_SHA" > release/commit.txt

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: pione-testmate-source-${{ steps.release.outputs.sha }}
          path: release/
          retention-days: 30

  deploy-staging:
    name: Deploy tested source to staging server
    needs: release-source
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging

    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      RELEASE_SHA: ${{ needs.release-source.outputs.sha }}

    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail

          missing=()

          [[ -n "$SERVER_HOST" ]] || missing+=("SERVER_HOST")
          [[ -n "$SERVER_USER" ]] || missing+=("SERVER_USER")
          [[ -n "$SERVER_SSH_KEY" ]] || missing+=("SERVER_SSH_KEY")
          [[ -n "$SERVER_KNOWN_HOSTS" ]] || missing+=("SERVER_KNOWN_HOSTS")
          [[ -n "$DEPLOY_PATH" ]] || missing+=("DEPLOY_PATH")

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Download tested release bundle
        uses: actions/download-artifact@v4
        with:
          name: pione-testmate-source-${{ needs.release-source.outputs.sha }}
          path: release/

      - name: Configure trusted SSH connection
        shell: bash
        run: |
          set -euo pipefail

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Copy release to staging server
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="pione-testmate-${RELEASE_SHA}.tar.gz"
          test -f "release/$ARCHIVE"

          scp -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            "release/$ARCHIVE" \
            "$SERVER_USER@$SERVER_HOST:/tmp/$ARCHIVE"

      - name: Build with Docker and verify health
        shell: bash
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE_SCRIPT'

          set -euo pipefail

          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
          : "${RELEASE_SHA:?RELEASE_SHA is required}"

          RELEASE_ROOT="$DEPLOY_PATH/releases"
          RELEASE_DIR="$RELEASE_ROOT/$RELEASE_SHA"
          ARCHIVE="/tmp/pione-testmate-$RELEASE_SHA.tar.gz"

          test -f "$ARCHIVE"

          if [[ ! -f "$DEPLOY_PATH/.env" ]]; then
            echo "Missing $DEPLOY_PATH/.env. Create it on the server before deployment."
            exit 1
          fi

          mkdir -p "$RELEASE_ROOT"
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"

          cp "$DEPLOY_PATH/.env" "$RELEASE_DIR/pione-testmate/.env"

          cd "$RELEASE_DIR/pione-testmate"

          docker compose \
            -f docker-compose.prod.yml \
            --project-name pione-testmate \
            up -d --build --remove-orphans

          echo "Waiting for application health check..."

          for attempt in $(seq 1 20); do
            if docker compose \
              -f docker-compose.prod.yml \
              --project-name pione-testmate \
              exec -T app \
              python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
            then
              ln -sfn "$RELEASE_DIR/pione-testmate" "$DEPLOY_PATH/current"
              rm -f "$ARCHIVE"

              echo "Deployment successful: $RELEASE_SHA"
              exit 0
            fi

            echo "Health check attempt $attempt/20 failed. Retrying..."
            sleep 3
          done

          docker compose \
            -f docker-compose.prod.yml \
            --project-name pione-testmate \
            ps

          echo "Application health check failed."
          exit 1
          REMOTE_SCRIPT
