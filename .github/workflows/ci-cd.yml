name: PiOne Testmate CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git branch, tag, or commit SHA to test and deploy
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: pione-testmate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-and-tests:
    name: Python quality and V2 unit suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Verify Playwright Chromium
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              print("Chromium launched successfully")
              browser.close()
          PY

      - name: Compile application source
        run: python -m compileall -q api automation_framework

      - name: Run default V2 test suite
        run: |
          mkdir -p artifacts
          pytest -q --junitxml=artifacts/unit-results.xml

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-evidence-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  build-and-push-image:
    name: Build and push Docker image to GHCR
    needs: quality-and-tests
    # Do not publish images from pull requests. Secrets are only used for
    # pushes to main and manually approved workflow_dispatch runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Check out tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Resolve release commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git rev-parse HEAD)"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Set lowercase GHCR image name
        id: image
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          OWNER="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${OWNER}/pione-testmate" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Use the repository-scoped GITHUB_TOKEN to publish the package.
      # The job-level packages: write permission authorizes this push.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.release.outputs.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy GHCR image to staging server
    needs: build-and-push-image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging

    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      EXPECTED_SSH_HOST_FINGERPRINT: SHA256:UoB3pJXEXyTWKlLOGxaDxG1F4XQTx/vv+2fHmxaHwzg
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      GHCR_IMAGE: ${{ needs.build-and-push-image.outputs.image }}
      IMAGE_TAG: ${{ needs.build-and-push-image.outputs.sha }}

    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          [[ -n "$SERVER_HOST" ]] || missing+=("SERVER_HOST")
          [[ -n "$SERVER_USER" ]] || missing+=("SERVER_USER")
          [[ -n "$SERVER_SSH_KEY" ]] || missing+=("SERVER_SSH_KEY")
          [[ -n "$EXPECTED_SSH_HOST_FINGERPRINT" ]] || missing+=("EXPECTED_SSH_HOST_FINGERPRINT")
          [[ -n "$DEPLOY_PATH" ]] || missing+=("DEPLOY_PATH")
          # These credentials are used by the staging VM to pull a private GHCR image.
          [[ -n "$GHCR_USERNAME" ]] || missing+=("GHCR_USERNAME")
          [[ -n "$GHCR_TOKEN" ]] || missing+=("GHCR_TOKEN")

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Check out deployment configuration
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-push-image.outputs.sha }}

      - name: Prepare Docker Compose for GHCR deployment
        shell: bash
        run: |
          set -euo pipefail
          test -f docker-compose.prod.yml

          # The repository Compose file was originally configured to build
          # "pione-testmate" locally. For GHCR deployment, remove that build
          # block and point the app service at the exact image pushed by CI.
          python - <<'PY'
          from pathlib import Path
          import re

          compose = Path("docker-compose.prod.yml")
          lines = compose.read_text(encoding="utf-8").splitlines(keepends=True)

          result = []
          index = 0
          removed_build = False

          while index < len(lines):
              line = lines[index]
              if re.match(r"^    build\s*:\s*(?:#.*)?$", line.rstrip("\n")):
                  removed_build = True
                  index += 1
                  while index < len(lines):
                      candidate = lines[index]
                      if candidate.strip() and len(candidate) - len(candidate.lstrip(" ")) <= 4:
                          break
                      index += 1
                  continue
              result.append(line)
              index += 1

          text = "".join(result)
          text, image_count = re.subn(
              r"(?m)^    image\s*:.*$",
              "    image: ${" + "GHCR_IMAGE}:" + "${" + "IMAGE_TAG}",
              text,
          )

          if image_count != 1:
              raise SystemExit(
                  f"Expected exactly one app image declaration, found {image_count}. "
                  "Check docker-compose.prod.yml structure."
              )

          compose.write_text(text, encoding="utf-8")
          print("Compose configured to pull the GHCR image; local build disabled.")
          PY

          echo "Effective Compose image declaration:"
          grep -nE '^    (build|image):' docker-compose.prod.yml || true

      - name: Configure trusted SSH connection
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Fetch the host key for the exact host used by SSH/SCP and pin it
          # against the fingerprint verified directly on the staging server.
          SCAN_FILE="$(mktemp)"
          ssh-keyscan -T 10 -t ed25519 "$SERVER_HOST" 2>/dev/null > "$SCAN_FILE"

          if [[ ! -s "$SCAN_FILE" ]]; then
            echo "::error::Could not retrieve the ED25519 SSH host key from SERVER_HOST."
            exit 1
          fi

          ACTUAL_FINGERPRINT="$(ssh-keygen -lf "$SCAN_FILE" | awk '{print $2}')"
          if [[ "$ACTUAL_FINGERPRINT" != "$EXPECTED_SSH_HOST_FINGERPRINT" ]]; then
            echo "::error::SSH host fingerprint mismatch. Expected $EXPECTED_SSH_HOST_FINGERPRINT but received $ACTUAL_FINGERPRINT"
            exit 1
          fi

          install -m 644 "$SCAN_FILE" ~/.ssh/known_hosts
          rm -f "$SCAN_FILE"

      - name: Copy Docker Compose configuration to server
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            docker-compose.prod.yml \
            "$SERVER_USER@$SERVER_HOST:/tmp/pione-testmate-docker-compose.prod.yml"

      - name: Log in to GHCR on staging server
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Pull GHCR image, deploy, and verify health
        shell: bash
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' GHCR_IMAGE='$GHCR_IMAGE' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE_SCRIPT'

          set -euo pipefail

          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
          : "${GHCR_IMAGE:?GHCR_IMAGE is required}"
          : "${IMAGE_TAG:?IMAGE_TAG is required}"

          RELEASE_ROOT="$DEPLOY_PATH/releases"
          RELEASE_DIR="$RELEASE_ROOT/$IMAGE_TAG"
          APP_DIR="$RELEASE_DIR/pione-testmate"

          if [[ ! -f "$DEPLOY_PATH/.env" ]]; then
            echo "Missing $DEPLOY_PATH/.env. Create it on the server before deployment."
            exit 1
          fi

          mkdir -p "$APP_DIR" "$RELEASE_ROOT"
          install -m 644 /tmp/pione-testmate-docker-compose.prod.yml \
            "$APP_DIR/docker-compose.prod.yml"
          cp "$DEPLOY_PATH/.env" "$APP_DIR/.env"

          cd "$APP_DIR"

          export GHCR_IMAGE IMAGE_TAG

          echo "Pulling image: $GHCR_IMAGE:$IMAGE_TAG"
          docker compose \
            --env-file .env \
            -f docker-compose.prod.yml \
            --project-name pione-testmate \
            pull

          docker compose \
            --env-file .env \
            -f docker-compose.prod.yml \
            --project-name pione-testmate \
            up -d --no-build --remove-orphans

          echo "Waiting for application health check..."

          for attempt in $(seq 1 20); do
            if docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              --project-name pione-testmate \
              exec -T app \
              python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
            then
              ln -sfn "$APP_DIR" "$DEPLOY_PATH/current"
              rm -f /tmp/pione-testmate-docker-compose.prod.yml
              echo "Deployment successful: $IMAGE_TAG"
              exit 0
            fi

            echo "Health check attempt $attempt/20 failed. Retrying..."
            sleep 3
          done

          docker compose \
            --env-file .env \
            -f docker-compose.prod.yml \
            --project-name pione-testmate \
            ps

          echo "Application health check failed."
          exit 1
          REMOTE_SCRIPT
