services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pione-testmate:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the PostgreSQL application database}
      DATABASE_FALLBACK_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
    ports:
      - "${APP_PORT:-8000}:8000"
    shm_size: "1gb"
    volumes:
      - pione_reports:/app/automation_framework/reports
      - pione_logs:/app/automation_framework/logs
      - pione_scans:/app/scans
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  db:
    image: postgres:17
    container_name: pione_testmate_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: testmate
      POSTGRES_USER: testmate_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pione_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testmate_user -d testmate"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pione_reports:
  pione_logs:
  pione_scans:
  pione_postgres_data:
